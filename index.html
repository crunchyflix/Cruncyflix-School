<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f0f0f">
<title>Crunchyflix School by Daksh Sharma</title>
<style>
:root{--bg:#0f0f0f;--s:#181818;--s2:#222;--line:#2c2c2c;--red:#ff4655;--text:#f3f3f3;--muted:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#0f0f0f;z-index:50}
#login.out{opacity:0;visibility:hidden}
.login-card{width:100%;max-width:380px;background:var(--s);border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center}
.brand{font-weight:800;font-size:1.9rem;color:var(--red)}
.brand-sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.field{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-top:14px}
.btn-primary{width:100%;margin-top:14px;padding:13px;background:var(--red);border:0;border-radius:10px;font-weight:700;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.95);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tabs{display:flex;gap:4px;background:var(--s);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 20px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.active{background:var(--red);color:#fff}
.search input{border-radius:999px;background:var(--s);padding-left:18px}
main{max-width:1400px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--s);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.poster{aspect-ratio:2/3;background:#222;position:relative}
.poster img{width:100%;height:100%;object-fit:cover}
.info{padding:10px 8px}
.info h3{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.98);display:flex;flex-direction:column}
.p-head{display:flex;justify-content:space-between;padding:12px 18px;background:#121212;border-bottom:1px solid var(--line)}
.vwrap{position:relative;width:100%;flex-grow:1;background:#000;display:flex;align-items:center;justify-content:center}
#video{width:100%;max-height:70vh;background:#000}
.controls{background:#121212;border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.group{display:flex;align-items:center;gap:6px}
.chip{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--s);cursor:pointer;font-size:.85rem;font-weight:600}
.chip.active{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<section id="login">
<div class="login-card">
<div class="brand">Crunchyflix School</div>
<div class="brand-sub">-by Daksh Sharma</div>
<input class="field" id="pass" type="password" placeholder="Passcode (Daksh 528)" style="text-align:center">
<button class="btn-primary" onclick="tryLogin()">Enter</button>
<div id="err" style="color:#ff4655;font-size:.85rem;margin-top:10px"></div>
</div>
</section>
<div id="app" class="hidden">
<header>
<div class="bar">
<div><div class="brand" style="font-size:1.3rem">Crunchyflix</div><div class="brand-sub">-by Daksh Sharma</div></div>
<div class="tabs">
<button class="tab active" id="btn-movies" onclick="switchTab('movies')">Movies</button>
<button class="tab" id="btn-anime" onclick="switchTab('anime')">Anime</button>
</div>
<div class="search"><input class="field" id="search-input" type="search" placeholder="Search..." oninput="filterContent()"></div>
</div>
</header>
<main>
<div id="section-title" style="font-size:1.1rem;font-weight:700;margin-bottom:12px">Trending Movies</div>
<div class="grid" id="main-grid"></div>
</main>
</div>
<div id="modal" class="hidden">
<div class="p-head"><h2 id="pTitle" style="font-size:1.1rem;color:#ff4655">Streaming</h2><button class="chip" onclick="closePlayer()">✕</button></div>
<div class="vwrap"><video id="video" controls autoplay playsinline preload="auto"></video></div>
<div class="controls">
<div class="ctrl-row">
<div class="group">
<span style="font-size:.8rem;color:#9a9a9a;font-weight:700">Audio:</span>
<button id="btn-sub" class="chip active" onclick="switchAudio('sub')">JPN Sub</button>
<button id="btn-dub-en" class="chip" onclick="switchAudio('dub-en')">ENG Dub</button>
<button id="btn-dub-hi" class="chip" onclick="switchAudio('dub-hi')">HIN Dub</button>
</div>
<div class="group">
<button class="chip" onclick="skipTime(-10)">-10s</button>
<button class="chip" onclick="skipTime(10)">+10s</button>
</div>
</div>
</div>
</div>
<script>
const mediaLibrary = {
  movies: [
    { title: 'Spider-Man: Across the Spider-Verse', img: 'https://images.unsplash.com/photo-1635805737707-575885ab0820?w=500', streams: { sub: 'https://vjs.zencdn.net/v/oceans.mp4', eng: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' } },
    { title: 'Avengers: Endgame', img: 'https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', eng: 'https://vjs.zencdn.net/v/oceans.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' } },
    { title: 'Interstellar', img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', eng: 'https://vjs.zencdn.net/v/oceans.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' } }
  ],
  anime: [
    { title: 'Demon Slayer S4: Hashira Training', img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500', streams: { sub: 'https://vjs.zencdn.net/v/oceans.mp4', eng: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' } },
    { title: 'Jujutsu Kaisen Season 2', img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', eng: 'https://vjs.zencdn.net/v/oceans.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' } },
    { title: 'Solo Leveling Season 1', img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', eng: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', hin: 'https://vjs.zencdn.net/v/oceans.mp4' } }
  ]
};

let currentTab = 'movies';
let activeItem = null;

function tryLogin() {
  const p = document.getElementById('pass').value.trim().toLowerCase();
  if (p === 'daksh 528' || p === 'daksh528') {
    document.getElementById('login').classList.add('out');
    document.getElementById('app').classList.remove('hidden');
    renderGrid();
  } else {
    document.getElementById('err').textContent = 'Incorrect passcode!';
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('btn-movies').classList.toggle('active', tab === 'movies');
  document.getElementById('btn-anime').classList.toggle('active', tab === 'anime');
  document.getElementById('section-title').textContent = tab === 'movies' ? 'Trending Movies' : 'Popular Anime';
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('main-grid');
  const items = mediaLibrary[currentTab];
  grid.innerHTML = items.map((item, index) => `
    <div class="card" onclick="openPlayer(${index})">
      <div class="poster"><img src="${item.img}" alt="${item.title}"></div>
      <div class="info"><h3>${item.title}</h3></div>
    </div>
  `).join('');
}

function filterContent() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    const title = card.querySelector('h3').innerText.toLowerCase();
    card.style.display = title.includes(q) ? '' : 'none';
  });
}

function openPlayer(index) {
  activeItem = mediaLibrary[currentTab][index];
  document.getElementById('pTitle').innerText = activeItem.title;
  const video = document.getElementById('video');
  const modal = document.getElementById('modal');
  
  const savedTime = localStorage.getItem('cfs_time_' + activeItem.title) || 0;
  video.src = activeItem.streams.sub;
  modal.classList.remove('hidden');
  video.currentTime = parseFloat(savedTime);
  video.play().catch(e => console.log(e));

  video.ontimeupdate = () => {
    if (video.currentTime > 0) {
      localStorage.setItem('cfs_time_' + activeItem.title, video.currentTime);
    }
  };
}

function switchAudio(lang) {
  if (!activeItem) return;
  const video = document.getElementById('video');
  const currentTime = video.currentTime;
  
  document.querySelectorAll('#btn-sub, #btn-dub-en, #btn-dub-hi').forEach(el => el.classList.remove('active'));
  
  if (lang === 'sub') {
    document.getElementById('btn-sub').classList.add('active');
    video.src = activeItem.streams.sub;
  } else if (lang === 'dub-en') {
    document.getElementById('btn-dub-en').classList.add('active');
    video.src = activeItem.streams.eng;
  } else if (lang === 'dub-hi') {
    document.getElementById('btn-dub-hi').classList.add('active');
    video.src = activeItem.streams.hin;
  }
  
  video.currentTime = currentTime;
  video.play();
}

function skipTime(sec) {
  const video = document.getElementById('video');
  video.currentTime += sec;
}

function closePlayer() {
  const video = document.getElementById('video');
  video.pause();
  video.src = '';
  document.getElementById('modal').classList.add('hidden');
}
</script>
</body>
</html>
