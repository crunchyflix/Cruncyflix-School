<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crunchyflix School - by Daksh Sharma</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; }
    .hidden { display: none !important; }

    /* Login Screen */
    #login-box { max-width: 340px; margin: 18vh auto; background: #18181b; padding: 30px; border-radius: 12px; text-align: center; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    #login-box h1 { margin: 0 0 6px 0; color: #ff4655; font-size: 24px; }
    #login-box p.subtitle { color: #a1a1aa; margin: 0 0 20px 0; font-size: 13px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 15px; border-radius: 8px; border: none; outline: none; }
    input { background: #27272a; color: white; border: 1px solid #3f3f46; }
    button { background: #ff4655; color: white; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; padding-bottom: 12px; margin-bottom: 16px; }
    .logo { font-size: 20px; font-weight: 700; color: #ff4655; }
    .byline { font-size: 11px; color: #a1a1aa; }
    .nav { display: flex; gap: 8px; }
    .nav button { width: auto; padding: 6px 14px; background: #27272a; font-size: 13px; margin: 0; }
    .nav button.active { background: #ff4655; }

    /* Search Bar */
    .search-box { margin-bottom: 16px; }
    .search-box input { width: 100%; background: #18181b; border: 1px solid #27272a; padding: 12px 14px; border-radius: 8px; color: white; font-size: 14px; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .card { background: #18181b; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #27272a; }
    .card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .card p { padding: 10px 8px; margin: 0; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Embedded Video Player Modal (Netmirror Style) */
    #player-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; z-index: 9999; }
    .player-topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #121214; border-bottom: 1px solid #27272a; }
    .player-topbar h3 { margin: 0; color: #ff4655; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
    .close-btn { background: #ff4655; border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .video-container { width: 100%; flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
    #video-stream { width: 100%; max-height: 70vh; background: #000; display: block; outline: none; }

    .player-toolbar { background: #121214; border-top: 1px solid #27272a; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .toolbar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .tool-group { display: flex; align-items: center; gap: 6px; }
    .tool-label { font-size: 11px; color: #a1a1aa; font-weight: 700; text-transform: uppercase; }
    
    .chip { background: #27272a; color: white; border: 1px solid #3f3f46; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; width: auto; margin: 0; }
    .chip.active { background: #ff4655; border-color: #ff4655; }
    select.chip { padding-right: 20px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-box">
    <h1>Crunchyflix School</h1>
    <p class="subtitle">-by Daksh Sharma</p>
    <input type="password" id="passcode" placeholder="Enter Passcode (Daksh 528)">
    <button onclick="unlockApp()">Enter</button>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <div class="header">
      <div>
        <div class="logo">Crunchyflix School</div>
        <div class="byline">-by Daksh Sharma</div>
      </div>
      <div class="nav">
        <button id="btn-movies" class="active" onclick="switchTab('movies')">Movies</button>
        <button id="btn-anime" onclick="switchTab('anime')">Anime</button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search movies..." oninput="filterContent()">
    </div>

    <!-- MOVIES -->
    <div id="movies-section" class="grid">
      <div class="card" onclick="openPlayer('Spider-Man: Across the Spider-Verse', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500" alt="Spider-Man">
        <p>Spider-Man: Spider-Verse</p>
      </div>
      <div class="card" onclick="openPlayer('Avengers: Endgame', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500" alt="Avengers">
        <p>Avengers: Endgame</p>
      </div>
    </div>

    <!-- ANIME -->
    <div id="anime-section" class="grid hidden">
      <div class="card" onclick="openPlayer('Demon Slayer S4 Ep 1', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500" alt="Demon Slayer">
        <p>Demon Slayer S4 Ep 1</p>
      </div>
      <div class="card" onclick="openPlayer('Jujutsu Kaisen S2 Ep 1', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')">
        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500" alt="Jujutsu Kaisen">
        <p>Jujutsu Kaisen S2 Ep 1</p>
      </div>
    </div>
  </div>

  <!-- PLAYER MODAL -->
  <div id="player-modal" class="hidden">
    <div class="player-topbar">
      <h3 id="player-title">Streaming</h3>
      <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    
    <div class="video-container">
      <video id="video-stream" controls autoplay playsinline preload="auto"></video>
    </div>

    <div class="player-toolbar">
      <div class="toolbar-row">
        <div class="tool-group">
          <span class="tool-label">Audio:</span>
          <button id="btn-sub" class="chip active" onclick="setAudio('sub')">JPN Sub</button>
          <button id="btn-dub-en" class="chip" onclick="setAudio('dub-en')">ENG Dub</button>
          <button id="btn-dub-hi" class="chip" onclick="setAudio('dub-hi')">HIN Dub</button>
        </div>
        <div class="tool-group">
          <span class="tool-label">Quality:</span>
          <select class="chip" onchange="changeQuality(this.value)">
            <option value="1080">1080p HD</option>
            <option value="720" selected>720p</option>
            <option value="480">480p</option>
          </select>
        </div>
      </div>
      <div class="toolbar-row">
        <div class="tool-group">
          <span class="tool-label">Skip:</span>
          <button class="chip" onclick="skip(-10)">-10s</button>
          <button class="chip" onclick="skip(10)">+10s</button>
        </div>
        <div class="tool-group">
          <span class="tool-label">Speed:</span>
          <select class="chip" onchange="setSpeed(this.value)">
            <option value="1">1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'movies';

    function unlockApp() {
      const pass = document.getElementById('passcode').value.trim();
      if (pass === "Daksh 528" || pass === "daksh528") {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      } else {
        alert('Incorrect passcode!');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const isMov = tab === 'movies';
      document.getElementById('movies-section').classList.toggle('hidden', !isMov);
      document.getElementById('anime-section').classList.toggle('hidden', isMov);
      document.getElementById('btn-movies').classList.toggle('active', isMov);
      document.getElementById('btn-anime').classList.toggle('active', !isMov);
      
      const sInput = document.getElementById('search-input');
      sInput.placeholder = isMov ? 'Search movies...' : 'Search anime...';
      sInput.value = '';
      filterContent();
    }

    function filterContent() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const activeSec = currentTab === 'movies' ? 'movies-section' : 'anime-section';
      const cards = document.getElementById(activeSec).getElementsByClassName('card');
      for (let c of cards) {
        const title = c.getElementsByTagName('p')[0].innerText.toLowerCase();
        c.style.display = title.includes(query) ? '' : 'none';
      }
    }

    function openPlayer(title, url) {
      document.getElementById('player-title').innerText = title;
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('video-stream');
      video.src = url;
      modal.classList.remove('hidden');
      video.play().catch(e => console.log(e));
    }

    function closePlayer() {
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('video-stream');
      video.pause();
      video.src = '';
      modal.classList.add('hidden');
    }

    function setAudio(type) {
      ['btn-sub', 'btn-dub-en', 'btn-dub-hi'].forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById('btn-' + type).classList.add('active');
    }

    function changeQuality(q) {
      console.log('Quality set to:', q);
    }

    function skip(sec) {
      const video = document.getElementById('video-stream');
      video.currentTime += sec;
    }

    function setSpeed(spd) {
      const video = document.getElementById('video-stream');
      video.playbackRate = parseFloat(spd);
    }
  </script>
</body>
</html>
