<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crunchyflix Global - by Daksh Sharma</title>
<style>
:root{--bg:#0f0f0f;--card:#181818;--line:#2a2a2a;--red:#ff4655;--text:#fff;--sub:#a0a0a0}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
header{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-size:1.4rem;font-weight:900;color:var(--red);letter-spacing:-0.5px}
.brand span{font-size:0.75rem;color:var(--sub);font-weight:400;display:block}
.nav-tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:30px;border:1px solid var(--line)}
.tab{padding:6px 18px;border-radius:20px;border:0;background:transparent;color:var(--sub);font-weight:700;cursor:pointer}
.tab.active{background:var(--red);color:#fff}
.search-box{flex:1;max-width:320px}
.search-box input{width:100%;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#fff;outline:none}
.search-box input:focus{border-color:var(--red)}
main{max-width:1400px;margin:20px auto;padding:0 16px}
.section-title{font-size:1.2rem;font-weight:800;margin:20px 0 12px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform 0.2s}
.card:hover{transform:translateY(-4px);border-color:var(--red)}
.poster{aspect-ratio:2/3;background:#222;position:relative}
.poster img{width:100%;height:100%;object-fit:cover}
.info{padding:8px}
.info h3{font-size:0.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{font-size:0.7rem;color:var(--sub);margin-top:2px}
#login{position:fixed;inset:0;background:var(--bg);z-index:999;display:grid;place-items:center}
.login-box{background:var(--card);padding:30px;border-radius:16px;border:1px solid var(--line);width:90%;max-width:360px;text-align:center}
.login-box input{width:100%;padding:12px;margin:15px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#fff;text-align:center}
.login-box button{width:100%;padding:12px;border-radius:8px;border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer}
#modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.95);display:flex;flex-direction:column}
.modal-header{display:flex;justify-content:space-between;padding:12px 20px;background:#141414;border-bottom:1px solid var(--line)}
.vwrap{flex:1;background:#000;position:relative}
iframe, video{width:100%;height:100%;border:0}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="brand">Crunchyflix School <span>by Daksh Sharma</span></div>
    <input type="password" id="passInput" placeholder="Passcode (Daksh 528)">
    <button onclick="login()">Enter Global Catalog</button>
  </div>
</div>

<header>
  <div class="brand">Crunchyflix <span>Global Catalog</span></div>
  <div class="nav-tabs">
    <button class="tab active" id="t-anime" onclick="switchTab('anime')">Anime (10k+)</button>
    <button class="tab" id="t-movies" onclick="switchTab('movies')">Movies (Global)</button>
  </div>
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="Search thousands of titles..." oninput="handleSearch()">
  </div>
</header>

<main>
  <div class="section-title" id="secTitle">Trending Worldwide Anime</div>
  <div class="grid" id="contentGrid"></div>
</main>

<div id="modal" class="hidden">
  <div class="modal-header">
    <h2 id="mTitle" style="font-size:1.1rem;color:var(--red)"></h2>
    <button onclick="closePlayer()" style="background:none;border:0;color:#fff;font-size:1.4rem;cursor:pointer">✕</button>
  </div>
  <div class="vwrap" id="vwrap"></div>
</div>

<script>
let currentTab = 'anime';
let searchTimeout = null;

function login(){
  const p = document.getElementById('passInput').value.trim().toLowerCase();
  if(p === 'daksh 528' || p === 'daksh528'){
    document.getElementById('login').classList.add('hidden');
    loadAnime('TRENDING_DESC');
  } else {
    alert('Incorrect passcode!');
  }
}

function switchTab(type){
  currentTab = type;
  document.getElementById('t-anime').classList.toggle('active', type === 'anime');
  document.getElementById('t-movies').classList.toggle('active', type === 'movies');
  document.getElementById('searchInput').value = '';
  if(type === 'anime'){
    document.getElementById('secTitle').innerText = 'Trending Worldwide Anime';
    loadAnime('TRENDING_DESC');
  } else {
    document.getElementById('secTitle').innerText = 'Popular Global Movies';
    loadMovies();
  }
}

async function loadAnime(sort, query = null){
  const grid = document.getElementById('contentGrid');
  grid.innerHTML = '<p style="color:var(--sub)">Loading worldwide catalog...</p>';
  const gql = `
    query ($search: String, $sort: [MediaSort]) {
      Page(page: 1, perPage: 40) {
        media(type: ANIME, search: $search, sort: $sort) {
          id title { english romaji } coverImage { extraLarge } episodes averageScore trailer { id site }
        }
      }
    }`;
  try {
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query: gql, variables: { search: query, sort: query ? ['SEARCH_MATCH'] : [sort] } })
    });
    const data = await res.json();
    renderItems(data.data.Page.media.map(item => ({
      title: item.title.english || item.title.romaji,
      img: item.coverImage.extraLarge,
      meta: (item.episodes ? item.episodes + ' Eps • ' : '') + (item.averageScore ? item.averageScore + '%' : ''),
      yt: item.trailer && item.trailer.site === 'youtube' ? item.trailer.id : null
    })));
  } catch(e) {
    grid.innerHTML = '<p style="color:var(--red)">Failed to load live data.</p>';
  }
}

async function loadMovies(query = null){
  const grid = document.getElementById('contentGrid');
  grid.innerHTML = '<p style="color:var(--sub)">Loading movie library...</p>';
  const url = query 
    ? `https://itunes.apple.com/search?media=movie&entity=movie&term=${encodeURIComponent(query)}&limit=40`
    : `https://itunes.apple.com/us/rss/topmovies/limit=40/json`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    let list = [];
    if(query){
      list = data.results.map(m => ({
        title: m.trackName,
        img: m.artworkUrl100.replace('100x100bb', '400x600bb'),
        meta: m.primaryGenreName + ' • ' + (m.releaseDate || '').slice(0,4),
        stream: m.previewUrl
      }));
    } else {
      list = data.feed.entry.map(e => ({
        title: e['im:name'].label,
        img: e['im:image'][2].label.replace(/\d+x\d+bb/, '400x600bb'),
        meta: e.category.attributes.label,
        stream: e.link && e.link[1] ? e.link[1].attributes.href : null
      }));
    }
    renderItems(list);
  } catch(e) {
    grid.innerHTML = '<p style="color:var(--red)">Failed to load movies.</p>';
  }
}

function renderItems(items){
  const grid = document.getElementById('contentGrid');
  if(!items.length){ grid.innerHTML = '<p>No titles found.</p>'; return; }
  grid.innerHTML = items.map((item, i) => `
    <div class="card" onclick='openMedia(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
      <div class="poster"><img src="${item.img}" loading="lazy"></div>
      <div class="info">
        <h3>${item.title}</h3>
        <p>${item.meta || ''}</p>
      </div>
    </div>
  `).join('');
}

function handleSearch(){
  clearTimeout(searchTimeout);
  const q = document.getElementById('searchInput').value.trim();
  if(!q){ switchTab(currentTab); return; }
  searchTimeout = setTimeout(() => {
    document.getElementById('secTitle').innerText = `Search results for "${q}"`;
    if(currentTab === 'anime') loadAnime('SEARCH_MATCH', q);
    else loadMovies(q);
  }, 400);
}

function openMedia(item){
  document.getElementById('mTitle').innerText = item.title;
  const wrap = document.getElementById('vwrap');
  if(item.yt){
    wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.yt}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  } else if(item.stream){
    wrap.innerHTML = `<video src="${item.stream}" controls autoplay></video>`;
  } else {
    wrap.innerHTML = `<div style="color:#fff;display:grid;place-items:center;height:100%">No video stream available for this title.</div>`;
  }
  document.getElementById('modal').classList.remove('hidden');
}

function closePlayer(){
  document.getElementById('vwrap').innerHTML = '';
  document.getElementById('modal').classList.add('hidden');
}
</script>
</body>
</html>
