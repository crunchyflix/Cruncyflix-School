<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crunchyflix School - by Daksh Sharma</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0f0f; color: #f3f3f3; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; }
    button, input, select { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* Login Screen */
    #login { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at 50% 0%, #2a0f13 0%, #0f0f0f 60%); z-index: 9999; }
    .login-card { width: 100%; max-width: 380px; background: #181818; border: 1px solid #2c2c2c; border-radius: 16px; padding: 36px 28px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.8); }
    .brand { font-weight: 800; font-size: 1.9rem; color: #ff4655; letter-spacing: -0.02em; }
    .brand-sub { color: #9a9a9a; font-size: 0.9rem; margin-top: 2px; }
    .login-card p { margin: 22px 0 14px; color: #9a9a9a; font-size: 0.95rem; }
    .field { width: 100%; padding: 12px 14px; background: #0f0f0f; border: 1px solid #2c2c2c; border-radius: 10px; outline: none; }
    .field:focus { border-color: #ff4655; }
    .btn-primary { width: 100%; margin-top: 14px; padding: 13px; background: #ff4655; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }

    /* Header & Navigation */
    header { position: sticky; top: 0; z-index: 20; background: rgba(15,15,15,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #2c2c2c; }
    .bar { max-width: 1400px; margin: auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tabs { display: flex; gap: 4px; background: #181818; padding: 4px; border-radius: 999px; border: 1px solid #2c2c2c; }
    .tab { border: 0; background: transparent; padding: 7px 20px; border-radius: 999px; cursor: pointer; font-weight: 600; color: #9a9a9a; }
    .tab.active { background: #ff4655; color: #fff; }
    .search { flex: 1; max-width: 380px; }
    .search input { border-radius: 999px; background: #181818; padding-left: 18px; }

    /* Main Grid & Rows */
    main { max-width: 1400px; margin: auto; padding: 16px; }
    .row-title { font-size: 1.1rem; font-weight: 700; margin: 18px 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .card { background: #181818; border: 1px solid #2c2c2c; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); border-color: #ff4655; }
    .poster { aspect-ratio: 2/3; background: #222; position: relative; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .info { padding: 10px 8px; }
    .info h3 { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ADVANCED NETMIRROR / NETFLIX PLAYER MODAL */
    #modal { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; }
    .p-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: #121212; border-bottom: 1px solid #2c2c2c; }
    .p-head h2 { font-size: 1.1rem; color: #ff4655; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #2c2c2c; background: #181818; cursor: pointer; font-size: 16px; }

    .vwrap { position: relative; width: 100%; flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; }
    #video { width: 100%; max-height: 70vh; background: #000; outline: none; }
    
    /* Touch Gesture Zones (-10s / +10s) */
    .touch-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 5; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; pointer-events: auto; }
    .touch-left { left: 0; }
    .touch-right { right: 0; }
    .touch-ripple { background: rgba(255,70,85,0.3); border-radius: 50%; padding: 20px; font-weight: 800; font-size: 14px; }

    /* Controls Panel */
    .controls { background: #121212; border-top: 1px solid #2c2c2c; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
    .ctrl-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .group { display: flex; align-items: center; gap: 6px; }
    .group label { color: #9a9a9a; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; margin-right: 4px; }
    
    .chip { padding: 7px 14px; border-radius: 8px; border: 1px solid #2c2c2c; background: #181818; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .chip.active { background: #ff4655; border-color: #ff4655; color: #fff; }
    select.chip { padding-right: 24px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login">
    <div class="login-card">
      <div class="brand">Crunchyflix School</div>
      <div class="brand-sub">-by Daksh Sharma</div>
      <p>Enter passcode to unlock high-speed streaming.</p>
      <input class="field" id="pass" type="password" placeholder="Passcode (Daksh 528)" style="text-align: center;">
      <button class="btn-primary" onclick="tryLogin()">Enter</button>
      <div id="err" style="color: #ff4655; font-size: 0.85rem; margin-top: 10px;"></div>
    </div>
  </div>

  <!-- MAIN APP UI -->
  <div id="app" class="hidden">
    <header>
      <div class="bar">
        <div>
          <div class="brand" style="font-size: 1.3rem;">Crunchyflix</div>
          <div class="brand-sub">-by Daksh Sharma</div>
        </div>
        <div class="tabs">
          <button class="tab active" id="btn-movies" onclick="switchTab('movies')">Movies</button>
          <button class="tab" id="btn-anime" onclick="switchTab('anime')">Anime</button>
        </div>
        <div class="search">
          <input class="field" id="search-input" type="search" placeholder="Search..." oninput="filterContent()">
        </div>
      </div>
    </header>

    <main>
      <div class="row-title">
        <span id="section-title">Trending Movies</span>
      </div>
      <div class="grid" id="main-grid"></div>
    </main>
  </div>

  <!-- STREAMING PLAYER MODAL -->
  <div id="modal" class="hidden">
    <div class="p-head">
      <h2 id="pTitle">Now Streaming</h2>
      <button class="close" onclick="closePlayer()">✕</button>
    </div>
    
    <div class="vwrap">
      <!-- Touch Skip overlays for Mobile -->
      <div class="touch-zone touch-left" id="touch-left" onclick="handleDoubleTap(-10)">
        <div class="touch-ripple">-10s</div>
      </div>
      <div class="touch-zone touch-right" id="touch-right" onclick="handleDoubleTap(10)">
        <div class="touch-ripple">+10s</div>
      </div>

      <video id="video" controls autoplay playsinline preload="auto"></video>
    </div>

    <div class="controls">
      <div class="ctrl-row">
        <!-- Audio & Track Switcher -->
        <div class="group">
          <label>Audio:</label>
          <button id="btn-sub" class="chip active" onclick="switchAudio('sub')">JPN Sub</button>
          <button id="btn-dub-en" class="chip" onclick="switchAudio('dub-en')">ENG Dub</button>
          <button id="btn-dub-hi" class="chip" onclick="switchAudio('dub-hi')">HIN Dub</button>
        </div>

        <!-- Resolution Quality -->
        <div class="group">
          <label>Quality:</label>
          <select id="quality-select" class="chip" onchange="changeQuality(this.value)">
            <option value="1080">1080p HD</option>
            <option value="720" selected>720p</option>
            <option value="480">480p</option>
          </select>
        </div>
      </div>

      <div class="ctrl-row">
        <!-- Speed Controls -->
        <div class="group">
          <label>Speed:</label>
          <select id="speed-select" class="chip" onchange="setSpeed(this.value)">
            <option value="1.0">1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>

        <!-- Manual Skip Controls -->
        <div class="group">
          <button class="chip" onclick="skipTime(-10)">-10s</button>
          <button class="chip" onclick="skipTime(10)">+10s</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const mediaLibrary = {
      movies: [
        { title: 'Spider-Man: Across the Spider-Verse', img: 'https://images.unsplash.com/photo-1635805737707-575885ab0820?w=500', streams: { sub: 'https://vjs.zencdn.net/v/oceans.mp4', eng: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' } },
        { title: 'Avengers: Endgame', img: 'https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', eng: 'https://vjs.zencdn.net/v/oceans.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' } },
        { title: 'Interstellar', img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', eng: 'https://vjs.zencdn.net/v/oceans.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' } }
      ],
      anime: [
        { title: 'Demon Slayer S4: Hashira Training', img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500', streams: { sub: 'https://vjs.zencdn.net/v/oceans.mp4', eng: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' } },
        { title: 'Jujutsu Kaisen Season 2', img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', eng: 'https://vjs.zencdn.net/v/oceans.mp4', hin: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' } },
        { title: 'Solo Leveling Season 1', img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500', streams: { sub: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', eng: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', hin: 'https://vjs.zencdn.net/v/oceans.mp4' } }
      ]
    };

    let currentTab = 'movies';
    let activeItem = null;
    let tapTimer = null;

    function tryLogin() {
      const p = document.getElementById('pass').value.trim().toLowerCase();
      if (p === 'daksh 528' || p === 'daksh528') {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        renderGrid();
      } else {
        document.getElementById('err').textContent = 'Incorrect passcode!';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('btn-movies').classList.toggle('active', tab === 'movies');
      document.getElementById('btn-anime').classList.toggle('active', tab === 'anime');
      document.getElementById('section-title').textContent = tab === 'movies' ? 'Trending Movies' : 'Popular Anime';
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('main-grid');
      const items = mediaLibrary[currentTab];
      grid.innerHTML = items.map((item, index) => `
        <div class="card" onclick="openPlayer(${index})">
          <div class="poster"><img src="${item.img}" alt="${item.title}"></div>
          <div class="info"><h3>${item.title}</h3></div>
        </div>
      `).join('');
    }

    function filterContent() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const title = card.querySelector('h3').innerText.toLowerCase();
        card.style.display = title.includes(q) ? '' : 'none';
      });
    }

    function openPlayer(index) {
      activeItem = mediaLibrary[currentTab][index];
      document.getElementById('pTitle').innerText = activeItem.title;
      
      const video = document.getElementById('video');
      const modal = document.getElementById('modal');
      
      // Load saved timestamp position if available
      const savedTime = localStorage.getItem('cfs_time_' + activeItem.title) || 0;
      video.src = activeItem.streams.sub;
      modal.classList.remove('hidden');
      
      video.currentTime = parseFloat(savedTime);
      video.play().catch(e => console.log(e));

      // Save watch history position continuously
      video.ontimeupdate = () => {
        if (video.currentTime > 0) {
          localStorage.setItem('cfs_time_' + activeItem.title, video.currentTime);
        }
      };
    }

    function switchAudio(lang) {
      if (!activeItem) return;
      const video = document.getElementById('video');
      const currentTime = video.currentTime;
      
      document.querySelectorAll('#btn-sub, #btn-dub-en, #btn-dub-hi').forEach(el => el.classList.remove('active'));
      
      if (lang === 'sub') {
        document.getElementById('btn-sub').classList.add('active');
        video.src = activeItem.streams.sub;
      } else if (lang === 'dub-en') {
        document.getElementById('btn-dub-en').classList.add('active');
        video.src = activeItem.streams.eng;
      } else if (lang === 'dub-hi') {
        document.getElementById('btn-dub-hi').classList.add('active');
        video.src = activeItem.streams.hin;
      }
      
      video.currentTime = currentTime;
      video.play();
    }

    function handleDoubleTap(sec) {
      const zoneId = sec < 0 ? 'touch-left' : 'touch-right';
      const zone = document.getElementById(zoneId);
      zone.style.opacity = '1';
      skipTime(sec);
      setTimeout(() => { zone.style.opacity = '0'; }, 400);
    }

    function skipTime(sec) {
      const video = document.getElementById('video');
      video.currentTime += sec;
    }

    function setSpeed(spd) {
      document.getElementById('video').playbackRate = parseFloat(spd);
    }

    function changeQuality(q) {
      console.log('Switched quality resolution to:', q);
    }

    function closePlayer() {
      const video = document.getElementById('video');
      video.pause();
      video.src = '';
      document.getElementById('modal').classList.add('hidden');
    }
  </script>
</body>
</html>
