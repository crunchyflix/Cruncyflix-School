<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crunchyflix School - by Daksh Sharma</title>
  <style>
    body { background: #0f0f0f; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    #login-box { max-width: 350px; margin: 15vh auto; background: #1a1a1a; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #login-box h1 { margin-bottom: 5px; color: #ff4655; font-size: 26px; margin-top: 0; }
    #login-box p.subtitle { color: #888; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: none; box-sizing: border-box; }
    input { background: #2a2a2a; color: white; border: 1px solid #444; }
    button { background: #ff4655; color: white; cursor: pointer; font-weight: bold; }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .logo-container { display: flex; flex-direction: column; }
    .logo { font-size: 22px; font-weight: bold; color: #ff4655; }
    .byline { font-size: 12px; color: #888; margin-top: 2px; }
    .nav { display: flex; gap: 10px; }
    .nav button { width: auto; padding: 8px 16px; background: #222; margin: 0; }
    .nav button.active { background: #ff4655; }

    /* Search Bar */
    .search-container { margin-bottom: 20px; }
    .search-container input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 12px 15px; border-radius: 8px; color: white; font-size: 15px; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #2a2a2a; transition: transform 0.2s; }
    .card:hover { transform: scale(1.03); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card p { padding: 10px; margin: 0; font-size: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Player Modal */
    #player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; box-sizing: border-box; }
    .player-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; }
    #player-modal video { width: 100%; max-height: 65vh; background: black; border-radius: 8px; }
    
    .player-controls { display: flex; justify-content: space-between; width: 100%; margin-top: 12px; flex-wrap: wrap; gap: 10px; align-items: center; }
    .control-group { display: flex; gap: 8px; align-items: center; }
    .control-group select, .control-group button { background: #222; color: white; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; width: auto; margin: 0; }
    .control-group button.active-audio { background: #ff4655; border-color: #ff4655; }
    
    .close-btn { position: absolute; top: 20px; right: 25px; background: #ff4655; border: none; color: white; font-size: 18px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; z-index: 101; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-box">
    <h1>Crunchyflix School</h1>
    <p class="subtitle">-by Daksh Sharma</p>
    <input type="password" id="passcode" placeholder="Enter Passcode">
    <button onclick="unlockApp()">Enter</button>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <div class="header">
      <div class="logo-container">
        <span class="logo">Crunchyflix School</span>
        <span class="byline">-by Daksh Sharma</span>
      </div>
      <div class="nav">
        <button id="btn-movies" class="active" onclick="switchTab('movies')">Movies</button>
        <button id="btn-anime" onclick="switchTab('anime')">Anime</button>
      </div>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search movies or anime..." oninput="filterContent()">
    </div>

    <!-- MOVIES SECTION -->
    <div id="movies-section" class="grid">
      <div class="card" onclick="openPlayer('Big Buck Bunny', 'https://www.w3schools.com/html/mov_bbb.mp4')">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500" alt="Movie">
        <p>Big Buck Bunny</p>
      </div>
      <div class="card" onclick="openPlayer('Sci-Fi Odyssey', 'https://www.w3schools.com/html/mov_bbb.mp4')">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500" alt="Movie">
        <p>Sci-Fi Odyssey</p>
      </div>
    </div>

    <!-- ANIME SECTION -->
    <div id="anime-section" class="grid hidden">
      <div class="card" onclick="openPlayer('Cyberpunk Neon', 'https://www.w3schools.com/html/mov_bbb.mp4')">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500" alt="Anime">
        <p>Cyberpunk Neon Ep 1</p>
      </div>
      <div class="card" onclick="openPlayer('Ninja Chronicles', 'https://www.w3schools.com/html/mov_bbb.mp4')">
        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500" alt="Anime">
        <p>Ninja Chronicles Ep 1</p>
      </div>
    </div>
  </div>

  <!-- VIDEO PLAYER MODAL -->
  <div id="player-modal" class="hidden">
    <button class="close-btn" onclick="closePlayer()">✕</button>
    <div class="player-wrapper">
      <h3 id="player-title" style="margin-top:0; margin-bottom:10px; color:#ff4655;"></h3>
      <video id="video-stream" controls autoplay preload="auto">
        Your browser does not support video playback.
      </video>
      <div class="player-controls">
        <div class="control-group">
          <span style="font-size:12px; color:#aaa;">Audio:</span>
          <button id="btn-sub" class="active-audio" onclick="setAudio('sub')">Japanese Sub</button>
          <button id="btn-dub-en" onclick="setAudio('dub-en')">English Dub</button>
          <button id="btn-dub-hi" onclick="setAudio('dub-hi')">Hindi Dub</button>
        </div>
        <div class="control-group">
          <span style="font-size:12px; color:#aaa;">Quality:</span>
          <select id="quality-select" onchange="changeQuality(this.value)">
            <option value="1080p">1080p HD</option>
            <option value="720p" selected>720p</option>
            <option value="480p">480p</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentVideoUrl = '';
    let currentTab = 'movies';

    function unlockApp() {
      const pass = document.getElementById('passcode').value.trim();
      if (pass === "Daksh 528" || pass === "daksh528") {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      } else {
        alert('Incorrect password!');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const isMovies = tab === 'movies';
      document.getElementById('movies-section').classList.toggle('hidden', !isMovies);
      document.getElementById('anime-section').classList.toggle('hidden', isMovies);
      document.getElementById('btn-movies').classList.toggle('active', isMovies);
      document.getElementById('btn-anime').classList.toggle('active', !isMovies);
      document.getElementById('search-input').value = '';
      filterContent();
    }

    function filterContent() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const sectionId = currentTab === 'movies' ? 'movies-section' : 'anime-section';
      const cards = document.getElementById(sectionId).getElementsByClassName('card');
      
      for (let card of cards) {
        const title = card.getElementsByTagName('p')[0].innerText.toLowerCase();
        if (title.includes(query)) {
          card.style.display = "";
        } else {
          card.style.display = "none";
        }
      }
    }

    function openPlayer(title, url) {
      currentVideoUrl = url;
      document.getElementById('player-title').innerText = title;
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('video-stream');
      video.src = url;
      modal.classList.remove('hidden');
      video.play().catch(e => console.log(e));
    }

    function setAudio(type) {
      document.getElementById('btn-sub').classList.remove('active-audio');
      document.getElementById('btn-dub-en').classList.remove('active-audio');
      document.getElementById('btn-dub-hi').classList.remove('active-audio');
      
      if(type === 'sub') document.getElementById('btn-sub').classList.add('active-audio');
      if(type === 'dub-en') document.getElementById('btn-dub-en').classList.add('active-audio');
      if(type === 'dub-hi') document.getElementById('btn-dub-hi').classList.add('active-audio');
      
      // Audio track switching simulation feedback
      console.log('Switched audio track to:', type);
    }

    function changeQuality(quality) {
      console.log('Resolution changed to:', quality);
    }

    function closePlayer() {
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('video-stream');
      video.pause();
      video.src = "";
      modal.classList.add('hidden');
    }
  </script>
</body>
</html>
